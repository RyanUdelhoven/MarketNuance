name: marketnuance

services:
  marketnuance:
    build:
      context: .
    image: marketnuance:local
    ports:
      - "127.0.0.1:8766:8765"
    environment:
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:-}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:-}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_DATA_DELAY_MINUTES: ${ALPACA_DATA_DELAY_MINUTES:-0}
      MARKETNUANCE_SCREEN_LIMIT: ${MARKETNUANCE_SCREEN_LIMIT:-0}
      BUSINESS_MULTIPLE: ${BUSINESS_MULTIPLE:-15}
      BOOK_VALUE_MULTIPLE: ${BOOK_VALUE_MULTIPLE:-1.5}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    volumes:
      - marketnuance-data:/app/data
    restart: "no"

volumes:
  marketnuance-data:
